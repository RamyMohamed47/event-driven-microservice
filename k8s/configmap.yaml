apiVersion: v1
kind: ConfigMap
metadata:
  name: activity-log-config
data:
  NODE_ENV: production
  PORT: '3000'
  WORKER_PORT: '3001'
  LOG_LEVEL: info
  KAFKA_BROKERS: kafka.example.com:9093
  KAFKA_CLIENT_ID: activity-log-service
  KAFKA_TOPIC: user.activity.v1
  KAFKA_DLQ_TOPIC: user.activity.dlq.v1
  KAFKA_CONSUMER_GROUP: activity-log-processors-v1
  KAFKA_SSL: 'true'
